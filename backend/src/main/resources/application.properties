# ========================================================
# BookNest Spring Boot Application Configuration
# ========================================================

server.port=8080

# Database Configuration with Environment Variable Fallbacks
# Port 3307 is default for our dedicated local instance; easily overridden by setting DB_URL or DB_PORT
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:booknest_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false

# JWT Security Configuration
app.jwt.secret=${JWT_SECRET:booknest_super_secret_jwt_key_must_be_at_least_256_bits_long_1234567890}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Logging
logging.level.com.booknest=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN
