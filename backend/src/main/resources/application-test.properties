# ========================================================
# BookNest Test Profile Configuration (In-Memory H2 MySQL Mode)
# ========================================================

spring.datasource.url=jdbc:h2:mem:booknest_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

app.jwt.secret=test_super_secret_jwt_key_must_be_at_least_256_bits_long_1234567890
app.jwt.expiration-ms=3600000

logging.level.com.booknest=WARN
