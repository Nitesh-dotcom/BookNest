<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Account – BookNest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .page-hero { background:linear-gradient(135deg,#1A1A2E,#2D2D4E); color:#fff; padding:2rem 0; }
    .page-hero h1 { font-family:'Playfair Display',serif; font-size:2rem; font-weight:700; }
    .account-layout { display:grid; grid-template-columns:240px 1fr; gap:2rem; padding:2rem 0 4rem; align-items:start; }
    /* Sidebar */
    .account-sidebar { background:#fff; border:1px solid var(--border-color); border-radius:16px; overflow:hidden; position:sticky; top:90px; }
    .account-avatar { background:linear-gradient(135deg,var(--accent-primary),#E07B54); padding:2rem; text-align:center; }
    .avatar-circle { width:72px; height:72px; border-radius:50%; background:rgba(255,255,255,.2); display:flex; align-items:center; justify-content:center; font-size:1.8rem; font-weight:700; color:#fff; margin:0 auto 1rem; font-family:'Playfair Display',serif; }
    .avatar-name { font-weight:700; color:#fff; font-size:1.05rem; }
    .avatar-email { color:rgba(255,255,255,.75); font-size:.8rem; margin-top:.2rem; word-break:break-all; }
    .account-nav { padding:.75rem 0; }
    .account-nav a, .account-nav button { display:flex; align-items:center; gap:.75rem; padding:.75rem 1.5rem; font-size:.9rem; color:var(--text-secondary); text-decoration:none; font-family:inherit; border:none; background:none; width:100%; text-align:left; cursor:pointer; transition:all .15s; font-weight:500; }
    .account-nav a:hover, .account-nav button:hover { color:var(--accent-primary); background:var(--bg-primary); }
    .account-nav a.active { color:var(--accent-primary); background:linear-gradient(90deg,rgba(184,93,54,.08),transparent); font-weight:700; border-left:3px solid var(--accent-primary); }
    .account-nav .divider { border:none; border-top:1px solid var(--border-color); margin:.4rem 0; }
    .account-nav .sign-out { color:#DC2626; }
    .account-nav .sign-out:hover { background:#FEF2F2; }
    /* Content */
    .account-panel { background:#fff; border:1px solid var(--border-color); border-radius:16px; padding:1.75rem; }
    .panel-title { font-family:'Playfair Display',serif; font-size:1.3rem; font-weight:700; color:var(--text-primary); margin-bottom:1.5rem; padding-bottom:1rem; border-bottom:1px solid var(--border-color); }
    /* Stats */
    .stats-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:1rem; margin-bottom:1.75rem; }
    .stat-card { background:var(--bg-primary); border-radius:12px; padding:1.25rem; text-align:center; border:1px solid var(--border-color); }
    .stat-number { font-family:'Playfair Display',serif; font-size:2rem; font-weight:700; color:var(--accent-primary); }
    .stat-label { font-size:.8rem; color:var(--text-muted); margin-top:.3rem; font-weight:600; text-transform:uppercase; letter-spacing:.05em; }
    /* Forms */
    .section-sub { font-size:1rem; font-weight:700; color:var(--text-primary); margin:1.5rem 0 1rem; padding-bottom:.5rem; border-bottom:1px solid var(--border-color); }
    .form-group { margin-bottom:1rem; }
    .form-label { display:block; font-weight:600; font-size:.85rem; color:var(--text-primary); margin-bottom:.35rem; }
    .form-control { width:100%; padding:.7rem 1rem; border:1.5px solid var(--border-color); border-radius:10px; font-size:.9rem; font-family:inherit; background:var(--bg-primary); color:var(--text-primary); box-sizing:border-box; transition:border-color .2s; }
    .form-control:focus { outline:none; border-color:var(--accent-primary); }
    .form-control:disabled { opacity:.6; cursor:not-allowed; background:var(--bg-secondary); }
    .form-row { display:grid; grid-template-columns:1fr 1fr; gap:1rem; }
    .btn-save { padding:.7rem 1.8rem; border:none; border-radius:10px; background:var(--accent-primary); color:#fff; font-weight:700; font-family:inherit; font-size:.9rem; cursor:pointer; transition:background .2s; }
    .btn-save:hover:not(:disabled) { background:var(--accent-dark); }
    .btn-save:disabled { opacity:.5; cursor:not-allowed; }
    /* Role badge */
    .role-badge { display:inline-flex; align-items:center; background:var(--bg-secondary); color:var(--accent-primary); border-radius:20px; padding:.25rem .8rem; font-size:.78rem; font-weight:700; text-transform:uppercase; letter-spacing:.05em; }
    .role-badge.admin { background:#FEF3C7; color:#92400E; }
    /* Password section */
    .pw-input-wrap { position:relative; }
    .pw-toggle { position:absolute; right:.7rem; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer; color:var(--text-muted); padding:2px; }
    @media (max-width:800px) { .account-layout { grid-template-columns:1fr; } .account-sidebar { position:static; } .stats-grid { grid-template-columns:repeat(2,1fr); } .form-row { grid-template-columns:1fr; } }
    @media (max-width:480px) { .stats-grid { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <div id="site-header"></div>
  <section class="page-hero"><div class="container"><h1>My Account</h1></div></section>
  <main>
    <div class="container">
      <div class="account-layout">
        <!-- Sidebar -->
        <div class="account-sidebar">
          <div class="account-avatar">
            <div class="avatar-circle" id="avatar-initials">?</div>
            <div class="avatar-name" id="avatar-name">Loading…</div>
            <div class="avatar-email" id="avatar-email"></div>
          </div>
          <nav class="account-nav">
            <a href="account.html" class="active">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
              Profile & Settings
            </a>
            <a href="orders.html">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"></rect><path d="M6 8h12M6 12h8"></path></svg>
              My Orders
            </a>
            <a href="wishlist.html">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
              My Wishlist
            </a>
            <a href="cart.html">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
              Shopping Cart
            </a>
            <hr class="divider" />
            <button class="sign-out" onclick="window.auth && window.auth.logout()">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
              Sign Out
            </button>
          </nav>
        </div>

        <!-- Panel -->
        <div class="account-panel">
          <h2 class="panel-title">Profile &amp; Settings</h2>

          <!-- Stats -->
          <div class="stats-grid">
            <div class="stat-card">
              <div class="stat-number" id="stat-orders">—</div>
              <div class="stat-label">Total Orders</div>
            </div>
            <div class="stat-card">
              <div class="stat-number" id="stat-wishlist">—</div>
              <div class="stat-label">Wishlist</div>
            </div>
            <div class="stat-card">
              <div class="stat-number" id="stat-cart">—</div>
              <div class="stat-label">Cart Items</div>
            </div>
          </div>

          <!-- Account info (read-only) -->
          <div style="margin-bottom:1.5rem;">
            <div class="section-sub">Account Information</div>
            <div style="display:flex;align-items:center;gap:.75rem;margin-bottom:.75rem;">
              <span id="role-badge" class="role-badge">Customer</span>
              <span style="font-size:.8rem;color:var(--text-muted);">Member since <span id="member-since">—</span></span>
            </div>
            <div style="font-size:.875rem;color:var(--text-secondary);">
              <strong>Email:</strong> <span id="display-email">—</span> <em style="font-size:.8rem;">(cannot be changed)</em>
            </div>
          </div>

          <!-- Update profile form -->
          <div class="section-sub">Update Profile</div>
          <form id="profile-form">
            <div class="form-row">
              <div class="form-group">
                <label class="form-label" for="fullName">Full Name</label>
                <input class="form-control" type="text" id="fullName" required />
              </div>
              <div class="form-group">
                <label class="form-label" for="phone">Phone Number</label>
                <input class="form-control" type="tel" id="phone" placeholder="+1 (555) 000-0000" />
              </div>
            </div>
            <button type="submit" class="btn-save" id="profile-save-btn">Save Changes</button>
          </form>

          <!-- Change password form -->
          <div class="section-sub" style="margin-top:2rem;">Change Password</div>
          <form id="password-form">
            <div class="form-group">
              <label class="form-label" for="currentPw">Current Password</label>
              <div class="pw-input-wrap">
                <input class="form-control" type="password" id="currentPw" required placeholder="Enter current password" />
                <button type="button" class="pw-toggle" onclick="togglePw('currentPw')">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                </button>
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label class="form-label" for="newPw">New Password</label>
                <div class="pw-input-wrap">
                  <input class="form-control" type="password" id="newPw" required minlength="8" placeholder="Min 8 characters" />
                  <button type="button" class="pw-toggle" onclick="togglePw('newPw')">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                  </button>
                </div>
              </div>
              <div class="form-group">
                <label class="form-label" for="confirmPw">Confirm New Password</label>
                <input class="form-control" type="password" id="confirmPw" required placeholder="Re-enter new password" />
              </div>
            </div>
            <button type="submit" class="btn-save" id="pw-save-btn">Change Password</button>
          </form>
        </div>
      </div>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/wishlist.js"></script>
  <script src="js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      if (window.auth) window.auth.requireAuth();
      const user = window.auth ? window.auth.getUser() : null;
      if (!user) return;

      // Populate sidebar
      const initials = (user.fullName || 'R').split(' ').map(n => n[0]).join('').substring(0,2).toUpperCase();
      document.getElementById('avatar-initials').textContent = initials;
      document.getElementById('avatar-name').textContent = user.fullName || 'Reader';
      document.getElementById('avatar-email').textContent = user.email || '';

      // Populate form
      document.getElementById('fullName').value = user.fullName || '';
      document.getElementById('phone').value = user.phone || '';
      document.getElementById('display-email').textContent = user.email || '';

      // Role badge
      const roleBadge = document.getElementById('role-badge');
      roleBadge.textContent = user.role || 'CUSTOMER';
      if (user.role === 'ADMIN') roleBadge.classList.add('admin');

      // Member since
      if (user.createdAt) {
        document.getElementById('member-since').textContent = new Date(user.createdAt).toLocaleDateString('en-US',{year:'numeric',month:'long'});
      }

      // Load stats
      loadStats();
    });

    async function loadStats() {
      try {
        const [ordersData, wishlistData, cartData] = await Promise.allSettled([
          api.get('/orders', { page: 0, size: 1 }),
          api.get('/wishlist'),
          window.cart ? window.cart.getCart() : Promise.resolve({ itemCount: 0 })
        ]);
        if (ordersData.status === 'fulfilled') {
          const ord = (ordersData.value && ordersData.value.data !== undefined) ? ordersData.value.data : ordersData.value;
          document.getElementById('stat-orders').textContent = ord.totalElements || 0;
        }
        if (wishlistData.status === 'fulfilled') {
          const wl = (wishlistData.value && wishlistData.value.data !== undefined) ? wishlistData.value.data : wishlistData.value;
          document.getElementById('stat-wishlist').textContent = (wl.items || []).length;
        }
        if (cartData.status === 'fulfilled') {
          const cd = (cartData.value && cartData.value.data !== undefined) ? cartData.value.data : cartData.value;
          document.getElementById('stat-cart').textContent = cd.itemCount || 0;
        }
      } catch (e) {}
    }

    function togglePw(id) {
      const inp = document.getElementById(id);
      inp.type = inp.type === 'password' ? 'text' : 'password';
    }

    document.getElementById('profile-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fullName = document.getElementById('fullName').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const btn = document.getElementById('profile-save-btn');
      btn.disabled = true;
      btn.textContent = 'Saving…';
      try {
        await api.put('/users/profile', { fullName, phone });
        // Update stored user
        const user = window.auth.getUser();
        if (user) {
          user.fullName = fullName;
          user.phone = phone;
          sessionStorage.setItem('booknest_user', JSON.stringify(user));
          document.getElementById('avatar-name').textContent = fullName;
          const initials = fullName.split(' ').map(n => n[0]).join('').substring(0,2).toUpperCase();
          document.getElementById('avatar-initials').textContent = initials;
        }
        showToast('Profile updated successfully!', 'success');
      } catch (err) {
        showToast(err.message || 'Could not update profile.', 'error');
      }
      btn.disabled = false;
      btn.textContent = 'Save Changes';
    });

    document.getElementById('password-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const currentPassword = document.getElementById('currentPw').value;
      const newPassword = document.getElementById('newPw').value;
      const confirmPassword = document.getElementById('confirmPw').value;
      if (newPassword !== confirmPassword) { showToast('New passwords do not match.', 'error'); return; }
      if (newPassword.length < 8) { showToast('New password must be at least 8 characters.', 'error'); return; }
      const btn = document.getElementById('pw-save-btn');
      btn.disabled = true;
      btn.textContent = 'Changing…';
      try {
        await api.put('/users/password', { currentPassword, newPassword });
        showToast('Password changed successfully!', 'success');
        document.getElementById('password-form').reset();
      } catch (err) {
        showToast(err.message || 'Could not change password.', 'error');
      }
      btn.disabled = false;
      btn.textContent = 'Change Password';
    });
  </script>
</body>
</html>
