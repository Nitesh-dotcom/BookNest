<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c2724"/>
      <stop offset="50%" stop-color="#3d332a"/>
      <stop offset="100%" stop-color="#1e1b18"/>
    </linearGradient>
    <linearGradient id="spine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#141210"/>
      <stop offset="70%" stop-color="#2a241f"/>
      <stop offset="100%" stop-color="#3a322b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4a373"/>
      <stop offset="50%" stop-color="#faedcd"/>
      <stop offset="100%" stop-color="#ccd5ae"/>
    </linearGradient>
  </defs>

  <!-- Cover Background -->
  <rect width="400" height="600" rx="8" fill="url(#bg)"/>

  <!-- Left Spine -->
  <rect width="32" height="600" rx="4" fill="url(#spine)"/>
  <line x1="32" y1="0" x2="32" y2="600" stroke="#504336" stroke-width="1.5"/>

  <!-- Inner Elegant Border -->
  <rect x="52" y="30" width="318" height="540" fill="none" stroke="#d4a373" stroke-width="1.5" stroke-dasharray="8 4" opacity="0.6" rx="4"/>
  <rect x="58" y="36" width="306" height="528" fill="none" stroke="#d4a373" stroke-width="0.8" opacity="0.4"/>

  <!-- Corner Flourishes -->
  <circle cx="58" cy="36" r="3" fill="#d4a373"/>
  <circle cx="364" cy="36" r="3" fill="#d4a373"/>
  <circle cx="58" cy="564" r="3" fill="#d4a373"/>
  <circle cx="364" cy="564" r="3" fill="#d4a373"/>

  <!-- Book Icon Emblem -->
  <g transform="translate(180, 210) scale(1.6)" fill="none" stroke="url(#gold)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
    <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
    <line x1="9" y1="7" x2="15" y2="7"/>
    <line x1="9" y1="11" x2="15" y2="11"/>
  </g>

  <!-- Typography -->
  <text x="211" y="320" font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" font-size="24" font-weight="700" fill="#faedcd" text-anchor="middle" letter-spacing="2">BOOKNEST</text>
  <text x="211" y="345" font-family="'Inter', sans-serif" font-size="12" fill="#d4a373" text-anchor="middle" letter-spacing="3">CLASSIC COLLECTION</text>
  <line x1="130" y1="365" x2="290" y2="365" stroke="#d4a373" stroke-width="1" opacity="0.5"/>

  <text x="211" y="520" font-family="'Inter', sans-serif" font-size="11" fill="#a49382" text-anchor="middle" letter-spacing="1">LITERARY EXCELLENCE</text>
</svg>
