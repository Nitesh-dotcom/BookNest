<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Browse Books – BookNest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .catalog-layout { display: grid; grid-template-columns: 270px 1fr; gap: 2rem; padding: 2rem 0 4rem; }
    /* Sidebar */
    .catalog-sidebar { position: sticky; top: 90px; height: fit-content; }
    .filter-card { background: #fff; border-radius: 14px; padding: 1.5rem; border: 1px solid var(--border-color); margin-bottom: 1.2rem; }
    .filter-card h3 { font-size: 0.85rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted); margin-bottom: 1rem; }
    .filter-search-wrap { position: relative; }
    .filter-search-wrap svg { position: absolute; left: 0.75rem; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
    #sidebar-search { width: 100%; padding: 0.6rem 0.75rem 0.6rem 2.4rem; border: 1.5px solid var(--border-color); border-radius: 8px; font-size: 0.9rem; font-family: inherit; background: var(--bg-primary); color: var(--text-primary); box-sizing: border-box; }
    #sidebar-search:focus { outline: none; border-color: var(--accent-primary); }
    .category-list { list-style: none; padding: 0; margin: 0; }
    .category-list li { margin-bottom: 0.5rem; }
    .category-list label { display: flex; align-items: center; gap: 0.6rem; cursor: pointer; font-size: 0.9rem; color: var(--text-primary); }
    .category-list input[type="checkbox"] { accent-color: var(--accent-primary); width: 15px; height: 15px; }
    .cat-count { margin-left: auto; font-size: 0.78rem; color: var(--text-muted); background: var(--bg-secondary); padding: 1px 6px; border-radius: 10px; }
    .price-range { display: flex; gap: 0.5rem; align-items: center; }
    .price-range input { flex: 1; padding: 0.55rem 0.6rem; border: 1.5px solid var(--border-color); border-radius: 8px; font-size: 0.875rem; font-family: inherit; background: var(--bg-primary); color: var(--text-primary); width: 0; box-sizing: border-box; }
    .price-range input:focus { outline: none; border-color: var(--accent-primary); }
    .price-range span { color: var(--text-muted); font-size: 0.85rem; }
    .filter-apply-btn { width: 100%; margin-top: 0.75rem; padding: 0.6rem; border: none; border-radius: 8px; background: var(--accent-primary); color: #fff; font-weight: 600; font-family: inherit; font-size: 0.875rem; cursor: pointer; }
    .filter-apply-btn:hover { background: var(--accent-dark); }
    .instock-row label { display: flex; align-items: center; gap: 0.6rem; cursor: pointer; font-size: 0.9rem; color: var(--text-primary); }
    .instock-row input { accent-color: var(--accent-primary); width: 15px; height: 15px; }
    .clear-filters-btn { width: 100%; padding: 0.55rem; border: 1.5px solid var(--accent-primary); border-radius: 8px; background: transparent; color: var(--accent-primary); font-weight: 600; font-family: inherit; font-size: 0.85rem; cursor: pointer; margin-top: 0.5rem; }
    .clear-filters-btn:hover { background: var(--accent-primary); color: #fff; }
    /* Toolbar */
    .catalog-toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; gap: 1rem; flex-wrap: wrap; }
    .result-count { font-size: 0.95rem; color: var(--text-secondary); }
    .result-count strong { color: var(--text-primary); }
    .toolbar-right { display: flex; align-items: center; gap: 0.75rem; }
    .sort-select { padding: 0.5rem 0.75rem; border: 1.5px solid var(--border-color); border-radius: 8px; font-size: 0.875rem; font-family: inherit; background: #fff; color: var(--text-primary); cursor: pointer; }
    .sort-select:focus { outline: none; border-color: var(--accent-primary); }
    .view-toggle { display: flex; border: 1.5px solid var(--border-color); border-radius: 8px; overflow: hidden; }
    .view-toggle button { padding: 0.45rem 0.7rem; border: none; background: #fff; cursor: pointer; color: var(--text-muted); transition: all 0.15s; }
    .view-toggle button.active { background: var(--accent-primary); color: #fff; }
    /* Book grid */
    .books-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 1.4rem; }
    .books-grid.list-view { grid-template-columns: 1fr; }
    .books-grid.list-view .book-card { display: flex; gap: 1.2rem; }
    .books-grid.list-view .book-card .card-cover { width: 100px; flex-shrink: 0; aspect-ratio: auto; height: 140px; }
    .books-grid.list-view .book-card .card-cover img { height: 140px; }
    .books-grid.list-view .book-card .card-body { flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
    /* Skeleton */
    .skeleton-card { background: #fff; border-radius: 14px; overflow: hidden; border: 1px solid var(--border-color); }
    .skeleton-img { width: 100%; aspect-ratio: 2/3; background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite; }
    .skeleton-line { height: 14px; border-radius: 4px; background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite; margin: 0.5rem 1rem; }
    .skeleton-line.short { width: 60%; }
    @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
    /* Pagination */
    .pagination { display: flex; align-items: center; justify-content: center; gap: 0.4rem; margin-top: 2.5rem; flex-wrap: wrap; }
    .pagination button { padding: 0.45rem 0.85rem; border: 1.5px solid var(--border-color); border-radius: 8px; background: #fff; color: var(--text-primary); font-family: inherit; font-size: 0.875rem; cursor: pointer; transition: all 0.15s; }
    .pagination button:hover:not(:disabled) { border-color: var(--accent-primary); color: var(--accent-primary); }
    .pagination button.active { background: var(--accent-primary); border-color: var(--accent-primary); color: #fff; }
    .pagination button:disabled { opacity: 0.45; cursor: not-allowed; }
    /* Empty state */
    .empty-state { text-align: center; padding: 4rem 2rem; color: var(--text-secondary); grid-column: 1/-1; }
    .empty-state .empty-icon { font-size: 4rem; margin-bottom: 1rem; }
    .empty-state h3 { font-family: 'Playfair Display', serif; font-size: 1.4rem; color: var(--text-primary); margin-bottom: 0.5rem; }
    /* Error banner */
    .error-banner { background: #FEF2F2; border: 1px solid #FCA5A5; color: #991B1B; border-radius: 10px; padding: 1rem 1.5rem; margin-bottom: 1.5rem; display: flex; align-items: center; gap: 1rem; }
    .error-banner button { margin-left: auto; padding: 0.4rem 0.9rem; border: 1px solid #991B1B; border-radius: 6px; background: transparent; color: #991B1B; cursor: pointer; font-family: inherit; font-size: 0.85rem; }
    /* Active filter tags */
    .active-filters { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 1rem; }
    .filter-tag { display: inline-flex; align-items: center; gap: 0.4rem; background: var(--accent-primary); color: #fff; border-radius: 20px; padding: 0.3rem 0.75rem; font-size: 0.8rem; font-weight: 600; }
    .filter-tag button { background: none; border: none; color: #fff; cursor: pointer; font-size: 1rem; line-height: 1; padding: 0; opacity: 0.8; }
    .filter-tag button:hover { opacity: 1; }
    /* Page hero */
    .catalog-hero { background: linear-gradient(135deg, #1A1A2E, #2D2D4E); color: #fff; padding: 2.5rem 0; margin-bottom: 0; }
    .catalog-hero h1 { font-family: 'Playfair Display', serif; font-size: 2.2rem; font-weight: 700; margin-bottom: 0.5rem; }
    .catalog-hero p { color: rgba(255,255,255,0.7); font-size: 0.95rem; }
    /* Guest banner */
    .guest-banner { background: linear-gradient(90deg, #FFF7F0, #FFF0E8); border: 1px solid #F5C9AE; border-radius: 10px; padding: 0.75rem 1.2rem; margin-bottom: 1.5rem; display: flex; align-items: center; gap: 1rem; font-size: 0.875rem; color: var(--text-secondary); }
    .guest-banner a { color: var(--accent-primary); font-weight: 600; text-decoration: none; margin-left: auto; white-space: nowrap; }
    @media (max-width: 900px) { .catalog-layout { grid-template-columns: 1fr; } .catalog-sidebar { position: static; display: flex; flex-wrap: wrap; gap: 1rem; } .filter-card { flex: 1; min-width: 220px; } }
    @media (max-width: 600px) { .books-grid { grid-template-columns: repeat(2, 1fr); } .catalog-toolbar { flex-direction: column; align-items: flex-start; } }
  </style>
</head>
<body>
  <div id="site-header"></div>

  <!-- Page Hero -->
  <section class="catalog-hero">
    <div class="container">
      <h1>Browse Our Collection</h1>
      <p>Discover handpicked books across every genre and interest</p>
    </div>
  </section>

  <main>
    <div class="container">
      <div class="catalog-layout">
        <!-- Sidebar -->
        <aside class="catalog-sidebar">
          <div class="filter-card">
            <h3>Search</h3>
            <div class="filter-search-wrap">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
              <input type="text" id="sidebar-search" placeholder="Title, author, ISBN…" />
            </div>
          </div>

          <div class="filter-card">
            <h3>Categories</h3>
            <ul class="category-list" id="category-list">
              <li style="color:var(--text-muted);font-size:0.85rem;">Loading…</li>
            </ul>
          </div>

          <div class="filter-card">
            <h3>Price Range</h3>
            <div class="price-range">
              <input type="number" id="min-price" placeholder="Min $" min="0" step="1" />
              <span>—</span>
              <input type="number" id="max-price" placeholder="Max $" min="0" step="1" />
            </div>
            <button class="filter-apply-btn" onclick="applyPriceFilter()">Apply</button>
          </div>

          <div class="filter-card">
            <h3>Availability</h3>
            <div class="instock-row">
              <label>
                <input type="checkbox" id="instock-only" />
                In Stock Only
              </label>
            </div>
          </div>

          <button class="clear-filters-btn" onclick="clearAllFilters()">✕ Clear All Filters</button>
        </aside>

        <!-- Main Content -->
        <div>
          <div id="error-banner" style="display:none;"></div>

          <div class="active-filters" id="active-filters"></div>

          <div class="catalog-toolbar">
            <div class="result-count" id="result-count">Loading books…</div>
            <div class="toolbar-right">
              <select class="sort-select" id="sort-select">
                <option value="">Sort By</option>
                <option value="title_asc">Title A→Z</option>
                <option value="title_desc">Title Z→A</option>
                <option value="price_asc">Price: Low→High</option>
                <option value="price_desc">Price: High→Low</option>
                <option value="newest">Newest First</option>
                <option value="rating">Top Rated</option>
              </select>
              <div class="view-toggle">
                <button id="grid-btn" class="active" title="Grid view" onclick="setView('grid')">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect></svg>
                </button>
                <button id="list-btn" title="List view" onclick="setView('list')">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
                </button>
              </div>
            </div>
          </div>

          <div class="books-grid" id="books-grid"></div>
          <div class="pagination" id="pagination"></div>
        </div>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/wishlist.js"></script>
  <script src="js/main.js"></script>
  <script>
    let currentPage = 0;
    let totalPages = 0;
    let totalElements = 0;
    let currentView = 'grid';
    let filters = { search: '', categoryId: null, minPrice: '', maxPrice: '', inStock: false, sort: '', featured: false };
    let categories = [];
    let debounceTimer;

    // Read URL params on load
    function readUrlParams() {
      const p = new URLSearchParams(window.location.search);
      if (p.get('query')) filters.search = p.get('query');
      if (p.get('category')) filters.categoryId = parseInt(p.get('category')) || null;
      if (p.get('sort')) filters.sort = p.get('sort');
      if (p.get('featured')) filters.featured = p.get('featured') === 'true';
      if (p.get('page')) currentPage = parseInt(p.get('page')) || 0;
    }

    function updateUrl() {
      const p = new URLSearchParams();
      if (filters.search) p.set('query', filters.search);
      if (filters.categoryId) p.set('category', filters.categoryId);
      if (filters.sort) p.set('sort', filters.sort);
      if (filters.featured) p.set('featured', 'true');
      if (currentPage > 0) p.set('page', currentPage);
      const qs = p.toString();
      history.pushState({}, '', qs ? '?' + qs : window.location.pathname);
    }

    async function loadCategories() {
      try {
        const res = await api.get('/categories');
        categories = (res && res.data !== undefined) ? res.data : (res || []);
        const list = document.getElementById('category-list');
        if (!categories || !categories.length) { list.innerHTML = '<li style="color:var(--text-muted);font-size:0.85rem;">No categories found.</li>'; return; }
        list.innerHTML = categories.map(c => `
          <li>
            <label>
              <input type="checkbox" class="cat-cb" data-id="${c.id}" ${filters.categoryId == c.id ? 'checked' : ''} />
              ${c.name}
              <span class="cat-count">${c.totalBooks || 0}</span>
            </label>
          </li>`).join('');
        list.querySelectorAll('.cat-cb').forEach(cb => {
          cb.addEventListener('change', () => {
            const checked = list.querySelectorAll('.cat-cb:checked');
            filters.categoryId = checked.length ? parseInt(checked[0].dataset.id) : null;
            // Uncheck others
            list.querySelectorAll('.cat-cb').forEach(o => { if (o !== checked[0]) o.checked = false; });
            currentPage = 0;
            loadBooks();
          });
        });
      } catch (e) {
        document.getElementById('category-list').innerHTML = '<li style="color:var(--text-muted);font-size:0.85rem;">Could not load categories.</li>';
      }
    }

    function showSkeletons() {
      const grid = document.getElementById('books-grid');
      grid.innerHTML = Array(12).fill(0).map(() => `
        <div class="skeleton-card">
          <div class="skeleton-img"></div>
          <div class="skeleton-line" style="margin-top:1rem;"></div>
          <div class="skeleton-line short"></div>
          <div class="skeleton-line short" style="width:40%;margin-bottom:1rem;"></div>
        </div>`).join('');
    }

    async function loadBooks() {
      showSkeletons();
      updateUrl();
      updateActiveFilterTags();

      const params = { page: currentPage, size: 12 };
      if (filters.search) params.search = filters.search;
      if (filters.categoryId) params.category = filters.categoryId;
      if (filters.minPrice !== '') params.minPrice = filters.minPrice;
      if (filters.maxPrice !== '') params.maxPrice = filters.maxPrice;
      if (filters.inStock) params.inStock = true;
      if (filters.sort) params.sortBy = filters.sort;
      if (filters.featured) params.featured = true;

      const errBanner = document.getElementById('error-banner');
      errBanner.style.display = 'none';

      try {
        const res = await api.get('/books', params);
        const result = (res && res.data !== undefined) ? res.data : res;
        totalPages = result.totalPages || 0;
        totalElements = result.totalElements || 0;
        renderBooks(result.content || []);
        renderPagination();
        updateResultCount();
      } catch (e) {
        errBanner.innerHTML = `<span>⚠ ${e.message}</span><button onclick="loadBooks()">Retry</button>`;
        errBanner.style.display = 'flex';
        document.getElementById('books-grid').innerHTML = '';
        document.getElementById('result-count').textContent = '';
      }
    }

    function renderBooks(books) {
      const grid = document.getElementById('books-grid');
      grid.className = 'books-grid' + (currentView === 'list' ? ' list-view' : '');
      if (!books.length) {
        grid.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">📚</div>
            <h3>No books found</h3>
            <p>Try adjusting your search or filters.</p>
            <button class="btn btn-primary" onclick="clearAllFilters()" style="margin-top:1.2rem;">Clear Filters</button>
          </div>`;
        return;
      }
      grid.innerHTML = books.map(b => renderBookCard(b)).join('');
    }

    function renderBookCard(b) {
      const hasDiscount = b.originalPrice && parseFloat(b.originalPrice) > parseFloat(b.price);
      const price = formatPrice(b.price);
      const origPrice = hasDiscount ? formatPrice(b.originalPrice) : '';
      const discPct = hasDiscount ? Math.round((1 - parseFloat(b.price) / parseFloat(b.originalPrice)) * 100) : 0;
      const outOfStock = !b.active || !b.stockQuantity || b.stockQuantity <= 0;
      const img = b.coverImageUrl || b.imageUrl || 'assets/placeholder.svg';
      const bJson = JSON.stringify(b).replace(/"/g, '&quot;');
      return `
        <div class="book-card">
          <a href="book-details.html?id=${b.id}" class="card-cover">
            <img src="${img}" alt="${b.title}" loading="lazy" onerror="handleImageError(this)" />
            ${b.bestseller ? '<span class="badge badge-featured" style="position:absolute;top:8px;left:8px;background:#D97706;">Bestseller</span>' : (b.featured ? '<span class="badge badge-featured" style="position:absolute;top:8px;left:8px;">Featured</span>' : '')}
            ${outOfStock ? '<span class="badge badge-out" style="position:absolute;top:8px;right:8px;">Out of Stock</span>' : ''}
            ${discPct > 0 ? `<span class="badge badge-sale" style="position:absolute;bottom:8px;left:8px;">-${discPct}%</span>` : ''}
          </a>
          <div class="card-body">
            <div class="card-category">${b.category ? b.category.name : ''}</div>
            <h3 class="card-title"><a href="book-details.html?id=${b.id}">${b.title}</a></h3>
            <p class="card-author">by ${b.author}</p>
            <div class="card-rating">
              ${renderStars(b.averageRating || 0)}
              <span class="rating-count">(${b.reviewCount || 0})</span>
            </div>
            <div class="card-footer">
              <div class="card-price">
                <span class="price-current">${price}</span>
                ${origPrice ? `<span class="price-original">${origPrice}</span>` : ''}
              </div>
              <div style="display:flex;gap:0.4rem;margin-top:0.75rem;">
                <button class="btn btn-primary btn-sm" style="flex:1;font-size:0.8rem;padding:0.45rem 0.5rem;"
                  onclick="addToCartFromCard(${bJson}, this)" ${outOfStock ? 'disabled' : ''}>
                  ${outOfStock ? 'Sold Out' : 'Add to Cart'}
                </button>
                <button class="btn btn-outline btn-sm" style="padding:0.45rem 0.6rem;"
                  onclick="window.wishlist && window.wishlist.toggle(${bJson})" title="Wishlist">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
                </button>
              </div>
            </div>
          </div>
        </div>`;
    }

    async function addToCartFromCard(book, btn) {
      btn.disabled = true;
      btn.textContent = 'Adding…';
      try {
        await window.cart.addItem(book, 1);
        showToast('Added to cart!', 'success');
        btn.textContent = 'Added ✓';
        setTimeout(() => { btn.textContent = 'Add to Cart'; btn.disabled = false; }, 1500);
      } catch (e) {
        showToast(e.message || 'Could not add to cart', 'error');
        btn.textContent = 'Add to Cart';
        btn.disabled = false;
      }
    }

    function renderPagination() {
      const pag = document.getElementById('pagination');
      if (totalPages <= 1) { pag.innerHTML = ''; return; }
      let html = `<button onclick="goToPage(${currentPage - 1})" ${currentPage === 0 ? 'disabled' : ''}>← Prev</button>`;
      const pages = [];
      for (let i = 0; i < totalPages; i++) pages.push(i);
      const visible = pages.filter(p => p === 0 || p === totalPages - 1 || Math.abs(p - currentPage) <= 2);
      let prev = -1;
      visible.forEach(p => {
        if (prev !== -1 && p - prev > 1) html += '<button disabled>…</button>';
        html += `<button class="${p === currentPage ? 'active' : ''}" onclick="goToPage(${p})">${p + 1}</button>`;
        prev = p;
      });
      html += `<button onclick="goToPage(${currentPage + 1})" ${currentPage >= totalPages - 1 ? 'disabled' : ''}>Next →</button>`;
      pag.innerHTML = html;
    }

    function goToPage(p) {
      if (p < 0 || p >= totalPages) return;
      currentPage = p;
      loadBooks();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function updateResultCount() {
      const el = document.getElementById('result-count');
      const q = filters.search ? ` for "<strong>${filters.search}</strong>"` : '';
      el.innerHTML = `<strong>${totalElements}</strong> book${totalElements !== 1 ? 's' : ''} found${q}`;
    }

    function updateActiveFilterTags() {
      const wrap = document.getElementById('active-filters');
      let tags = '';
      if (filters.search) tags += `<span class="filter-tag">Search: ${filters.search} <button onclick="removeFilter('search')">×</button></span>`;
      if (filters.categoryId) {
        const cat = categories.find(c => c.id == filters.categoryId);
        tags += `<span class="filter-tag">${cat ? cat.name : 'Category'} <button onclick="removeFilter('category')">×</button></span>`;
      }
      if (filters.minPrice || filters.maxPrice) tags += `<span class="filter-tag">Price: ${filters.minPrice || '0'} – ${filters.maxPrice || '∞'} <button onclick="removeFilter('price')">×</button></span>`;
      if (filters.inStock) tags += `<span class="filter-tag">In Stock <button onclick="removeFilter('instock')">×</button></span>`;
      if (filters.featured) tags += `<span class="filter-tag">Featured <button onclick="removeFilter('featured')">×</button></span>`;
      wrap.innerHTML = tags;
    }

    function removeFilter(type) {
      if (type === 'search') { filters.search = ''; document.getElementById('sidebar-search').value = ''; }
      if (type === 'category') { filters.categoryId = null; document.querySelectorAll('.cat-cb').forEach(c => c.checked = false); }
      if (type === 'price') { filters.minPrice = ''; filters.maxPrice = ''; document.getElementById('min-price').value = ''; document.getElementById('max-price').value = ''; }
      if (type === 'instock') { filters.inStock = false; document.getElementById('instock-only').checked = false; }
      if (type === 'featured') { filters.featured = false; }
      currentPage = 0;
      loadBooks();
    }

    function clearAllFilters() {
      filters = { search: '', categoryId: null, minPrice: '', maxPrice: '', inStock: false, sort: '', featured: false };
      document.getElementById('sidebar-search').value = '';
      document.getElementById('min-price').value = '';
      document.getElementById('max-price').value = '';
      document.getElementById('instock-only').checked = false;
      document.getElementById('sort-select').value = '';
      document.querySelectorAll('.cat-cb').forEach(c => c.checked = false);
      currentPage = 0;
      loadBooks();
    }

    function applyPriceFilter() {
      filters.minPrice = document.getElementById('min-price').value;
      filters.maxPrice = document.getElementById('max-price').value;
      currentPage = 0;
      loadBooks();
    }

    function setView(v) {
      currentView = v;
      document.getElementById('grid-btn').classList.toggle('active', v === 'grid');
      document.getElementById('list-btn').classList.toggle('active', v === 'list');
      const grid = document.getElementById('books-grid');
      grid.className = 'books-grid' + (v === 'list' ? ' list-view' : '');
    }

    document.addEventListener('DOMContentLoaded', () => {
      readUrlParams();
      // Pre-fill sidebar search
      document.getElementById('sidebar-search').value = filters.search;
      // Pre-fill sort
      document.getElementById('sort-select').value = filters.sort;

      loadCategories();
      loadBooks();

      // Search debounce
      document.getElementById('sidebar-search').addEventListener('input', (e) => {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(() => {
          filters.search = e.target.value.trim();
          currentPage = 0;
          loadBooks();
        }, 400);
      });

      // Sort change
      document.getElementById('sort-select').addEventListener('change', (e) => {
        filters.sort = e.target.value;
        currentPage = 0;
        loadBooks();
      });

      // In-stock toggle
      document.getElementById('instock-only').addEventListener('change', (e) => {
        filters.inStock = e.target.checked;
        currentPage = 0;
        loadBooks();
      });

      // Keyboard: search on Enter in price fields
      ['min-price','max-price'].forEach(id => {
        document.getElementById(id).addEventListener('keypress', (e) => {
          if (e.key === 'Enter') applyPriceFilter();
        });
      });
    });
  </script>
</body>
</html>
