<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shopping Cart – BookNest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .cart-page-hero { background: linear-gradient(135deg,#1A1A2E,#2D2D4E); color:#fff; padding: 2rem 0; margin-bottom: 0; }
    .cart-page-hero h1 { font-family:'Playfair Display',serif; font-size:2rem; font-weight:700; }
    .cart-layout { display: grid; grid-template-columns: 1fr 360px; gap: 2rem; padding: 2rem 0 4rem; align-items: start; }
    /* Guest banner */
    .guest-banner { background: linear-gradient(90deg,#FFF7F0,#FFF0E8); border:1px solid #F5C9AE; border-radius:10px; padding:.75rem 1.2rem; margin-bottom:1.5rem; display:flex; align-items:center; gap:.75rem; font-size:.875rem; color:var(--text-secondary); }
    .guest-banner a { color:var(--accent-primary); font-weight:700; text-decoration:none; margin-left:auto; }
    /* Cart items */
    .cart-items-wrap { background:#fff; border-radius:16px; border:1px solid var(--border-color); overflow:hidden; }
    .cart-items-header { padding:1.2rem 1.5rem; border-bottom:1px solid var(--border-color); display:flex; align-items:center; justify-content:space-between; }
    .cart-items-header h2 { font-family:'Playfair Display',serif; font-size:1.2rem; font-weight:700; color:var(--text-primary); }
    .clear-cart-btn { background:none; border:none; color:var(--text-muted); font-size:.825rem; cursor:pointer; font-family:inherit; padding:.3rem .6rem; border-radius:6px; transition:all .15s; }
    .clear-cart-btn:hover { background:#FEE2E2; color:#DC2626; }
    .cart-item { display:grid; grid-template-columns:80px 1fr; gap:1rem; padding:1.2rem 1.5rem; border-bottom:1px solid var(--border-color); transition:background .15s; }
    .cart-item:last-child { border-bottom:none; }
    .cart-item:hover { background:var(--bg-primary); }
    .cart-item-img { width:80px; height:110px; object-fit:cover; border-radius:8px; display:block; }
    .cart-item-body { display:flex; flex-direction:column; justify-content:space-between; }
    .cart-item-title { font-weight:700; font-size:.95rem; color:var(--text-primary); text-decoration:none; display:block; margin-bottom:.2rem; }
    .cart-item-title:hover { color:var(--accent-primary); }
    .cart-item-author { font-size:.825rem; color:var(--text-muted); margin-bottom:.5rem; }
    .cart-item-unit { font-size:.85rem; color:var(--text-secondary); }
    .cart-item-controls { display:flex; align-items:center; justify-content:space-between; gap:1rem; margin-top:.75rem; flex-wrap:wrap; }
    .qty-ctrl { display:flex; align-items:center; border:1.5px solid var(--border-color); border-radius:8px; overflow:hidden; }
    .qty-ctrl button { padding:.4rem .8rem; border:none; background:var(--bg-secondary); color:var(--text-primary); cursor:pointer; font-size:.95rem; line-height:1; font-family:inherit; transition:background .15s; }
    .qty-ctrl button:hover:not(:disabled) { background:var(--border-color); }
    .qty-ctrl button:disabled { opacity:.4; cursor:not-allowed; }
    .qty-ctrl span { padding:.4rem .7rem; font-weight:600; font-size:.875rem; min-width:30px; text-align:center; }
    .line-total { font-weight:700; font-size:1rem; color:var(--text-primary); }
    .remove-btn { background:none; border:none; color:var(--text-muted); cursor:pointer; padding:.3rem; border-radius:6px; transition:all .15s; display:flex; align-items:center; }
    .remove-btn:hover { background:#FEE2E2; color:#DC2626; }
    /* Summary card */
    .summary-card { background:#fff; border-radius:16px; border:1px solid var(--border-color); padding:1.5rem; position:sticky; top:90px; }
    .summary-card h2 { font-family:'Playfair Display',serif; font-size:1.2rem; font-weight:700; color:var(--text-primary); margin-bottom:1.25rem; }
    .summary-row { display:flex; justify-content:space-between; align-items:center; font-size:.9rem; color:var(--text-secondary); margin-bottom:.75rem; }
    .summary-row.total { border-top:2px solid var(--border-color); padding-top:.75rem; margin-top:.5rem; font-size:1.05rem; font-weight:700; color:var(--text-primary); }
    .summary-row .free-ship { color:#16A34A; font-weight:700; }
    .shipping-note { font-size:.78rem; color:var(--text-muted); text-align:center; margin-bottom:1rem; }
    .btn-checkout { width:100%; padding:.9rem; border:none; border-radius:12px; background:var(--accent-primary); color:#fff; font-weight:700; font-size:1rem; font-family:inherit; cursor:pointer; margin-bottom:.75rem; transition:background .2s; display:flex; align-items:center; justify-content:center; gap:.5rem; text-decoration:none; }
    .btn-checkout:hover { background:var(--accent-dark); }
    .btn-checkout.disabled { opacity:.5; pointer-events:none; }
    .continue-link { display:block; text-align:center; color:var(--accent-primary); font-size:.875rem; font-weight:600; text-decoration:none; margin-top:.5rem; }
    .continue-link:hover { text-decoration:underline; }
    /* Security badges */
    .security-badges { display:flex; align-items:center; justify-content:center; gap:1rem; margin-top:1rem; padding-top:1rem; border-top:1px solid var(--border-color); }
    .security-badges span { display:flex; align-items:center; gap:.3rem; font-size:.75rem; color:var(--text-muted); }
    /* Free shipping progress */
    .shipping-progress { margin:1rem 0; }
    .shipping-progress-bar { height:6px; background:var(--bg-secondary); border-radius:3px; overflow:hidden; margin:.4rem 0; }
    .shipping-progress-fill { height:100%; background:#16A34A; border-radius:3px; transition:width .5s ease; }
    .shipping-progress p { font-size:.78rem; color:var(--text-secondary); text-align:center; }
    /* Empty cart */
    .empty-cart { text-align:center; padding:4rem 2rem; }
    .empty-cart .empty-icon { font-size:5rem; margin-bottom:1rem; }
    .empty-cart h2 { font-family:'Playfair Display',serif; font-size:1.5rem; margin-bottom:.5rem; color:var(--text-primary); }
    .empty-cart p { color:var(--text-secondary); margin-bottom:1.5rem; }
    /* Loading */
    .cart-skeleton { padding:1.5rem; }
    .skel { background:linear-gradient(90deg,#f0f0f0 25%,#e0e0e0 50%,#f0f0f0 75%); background-size:200% 100%; animation:shimmer 1.4s infinite; border-radius:6px; margin-bottom:.6rem; }
    @keyframes shimmer { 0%{background-position:200% 0}100%{background-position:-200% 0} }
    @media (max-width:800px) { .cart-layout { grid-template-columns:1fr; } .summary-card { position:static; } }
    @media (max-width:480px) { .cart-item { grid-template-columns:65px 1fr; } .cart-item-img { width:65px; height:90px; } }
  </style>
</head>
<body>
  <div id="site-header"></div>

  <section class="cart-page-hero">
    <div class="container">
      <h1>Shopping Cart</h1>
    </div>
  </section>

  <main>
    <div class="container">
      <div id="cart-content"></div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/wishlist.js"></script>
  <script src="js/main.js"></script>
  <script>
    const FREE_SHIP_THRESHOLD = 50;
    const SHIPPING_FEE = 4.99;
    const TAX_RATE = 0.05;
    let cartData = null;

    function renderCartSkeleton() {
      document.getElementById('cart-content').innerHTML = `
        <div class="cart-layout">
          <div class="cart-items-wrap">
            <div class="cart-skeleton">
              ${Array(3).fill(0).map(() => `
                <div style="display:grid;grid-template-columns:80px 1fr;gap:1rem;margin-bottom:1.5rem;">
                  <div class="skel" style="width:80px;height:110px;"></div>
                  <div>
                    <div class="skel" style="height:16px;width:70%;margin-bottom:.5rem;"></div>
                    <div class="skel" style="height:12px;width:40%;margin-bottom:.5rem;"></div>
                    <div class="skel" style="height:12px;width:30%;"></div>
                  </div>
                </div>`).join('')}
            </div>
          </div>
          <div class="summary-card">
            <div class="skel" style="height:18px;width:60%;margin-bottom:1rem;"></div>
            <div class="skel" style="height:14px;margin-bottom:.5rem;"></div>
            <div class="skel" style="height:14px;margin-bottom:.5rem;"></div>
            <div class="skel" style="height:46px;margin-top:1rem;border-radius:12px;"></div>
          </div>
        </div>`;
    }

    async function loadCart() {
      renderCartSkeleton();
      try {
        cartData = await window.cart.getCart();
        renderCart(cartData);
      } catch (e) {
        document.getElementById('cart-content').innerHTML = `
          <div style="text-align:center;padding:3rem;color:var(--text-secondary);">
            <p>Could not load your cart. <button onclick="loadCart()" style="color:var(--accent-primary);background:none;border:none;cursor:pointer;font-weight:700;">Try again</button></p>
          </div>`;
      }
    }

    function calcTotals(items) {
      const subtotal = items.reduce((s, i) => {
        const p = i.unitPrice || (i.book ? i.book.price : i.price) || 0;
        return s + (i.lineTotal ? parseFloat(i.lineTotal) : (parseFloat(p) * i.quantity));
      }, 0);
      const shipping = subtotal >= FREE_SHIP_THRESHOLD ? 0 : SHIPPING_FEE;
      const tax = subtotal * TAX_RATE;
      const total = subtotal + shipping + tax;
      return { subtotal, shipping, tax, total };
    }

    function renderCart(data) {
      const items = data.items || [];
      const isLoggedIn = window.auth && window.auth.isLoggedIn();

      if (!items.length) {
        document.getElementById('cart-content').innerHTML = `
          <div class="empty-cart">
            <div class="empty-icon">🛒</div>
            <h2>Your cart is empty</h2>
            <p>Discover our curated collection of books and add your favourites.</p>
            <a href="books.html" class="btn btn-primary">Browse Books</a>
          </div>`;
        return;
      }

      const { subtotal, shipping, tax, total } = calcTotals(items);
      const progress = Math.min((subtotal / FREE_SHIP_THRESHOLD) * 100, 100);
      const amountLeft = FREE_SHIP_THRESHOLD - subtotal;

      document.getElementById('cart-content').innerHTML = `
        ${!isLoggedIn ? `
          <div class="guest-banner">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
            Sign in to save your cart and checkout seamlessly
            <a href="login.html?redirect=cart.html">Sign In →</a>
          </div>` : ''}

        <div class="cart-layout">
          <!-- Items -->
          <div>
            <div class="cart-items-wrap">
              <div class="cart-items-header">
                <h2>${items.length} Item${items.length !== 1 ? 's' : ''} in Cart</h2>
                <button class="clear-cart-btn" onclick="clearCart()">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14H6L5 6"></path><path d="M10 11v6"></path><path d="M14 11v6"></path><path d="M9 6V4h6v2"></path></svg>
                  Clear Cart
                </button>
              </div>
              <div id="cart-items-list">
                ${items.map(item => renderCartItem(item)).join('')}
              </div>
            </div>
          </div>

          <!-- Summary -->
          <div class="summary-card">
            <h2>Order Summary</h2>

            ${subtotal < FREE_SHIP_THRESHOLD ? `
              <div class="shipping-progress">
                <div class="shipping-progress-bar">
                  <div class="shipping-progress-fill" style="width:${progress}%"></div>
                </div>
                <p>Add <strong>${formatPrice(amountLeft)}</strong> more for <strong style="color:#16A34A;">FREE shipping</strong>!</p>
              </div>` : ''}

            <div class="summary-row">
              <span>Subtotal (${items.length} items)</span>
              <span><strong>${formatPrice(subtotal)}</strong></span>
            </div>
            <div class="summary-row">
              <span>Shipping</span>
              <span>${shipping === 0 ? '<span class="free-ship">FREE</span>' : formatPrice(shipping)}</span>
            </div>
            <div class="summary-row">
              <span>Tax (5%)</span>
              <span>${formatPrice(tax)}</span>
            </div>
            <div class="summary-row total">
              <span>Order Total</span>
              <span>${formatPrice(total)}</span>
            </div>

            <a href="${isLoggedIn ? 'checkout.html' : 'login.html?redirect=checkout.html'}" class="btn-checkout" id="checkout-btn">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 12l2 2 4-4m6 2a9 9 0 1 1-18 0 9 9 0 0 1 18 0z"></path></svg>
              ${isLoggedIn ? 'Proceed to Checkout' : 'Sign In to Checkout'}
            </a>
            <a href="books.html" class="continue-link">← Continue Shopping</a>

            <div class="security-badges">
              <span>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                Secure
              </span>
              <span>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"></polyline></svg>
                Free Returns
              </span>
              <span>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"></path></svg>
                Fast Delivery
              </span>
            </div>
          </div>
        </div>
      `;
    }

    function renderCartItem(item) {
      const b = item.book || item;
      const title = b.title || item.title || 'Book';
      const author = b.author || item.author || '';
      const bookId = b.id || item.bookId;
      const price = item.unitPrice || b.price || item.price || 0;
      const img = b.coverImageUrl || b.imageUrl || item.imageUrl || 'assets/placeholder.svg';
      const lineTotal = item.lineTotal ? parseFloat(item.lineTotal) : (parseFloat(price) * item.quantity);

      return `
        <div class="cart-item" id="cart-item-${item.id}">
          <img class="cart-item-img" src="${img}" alt="${title}" onerror="handleImageError(this)" />
          <div class="cart-item-body">
            <div>
              <a href="book-details.html?id=${bookId}" class="cart-item-title">${title}</a>
              <div class="cart-item-author">${author}</div>
              <div class="cart-item-unit">Unit price: ${formatPrice(price)}</div>
            </div>
            <div class="cart-item-controls">
              <div class="qty-ctrl">
                <button onclick="updateQty('${item.id}', '${bookId}', ${item.quantity - 1})" ${item.quantity <= 1 ? 'disabled' : ''}>−</button>
                <span>${item.quantity}</span>
                <button onclick="updateQty('${item.id}', '${bookId}', ${item.quantity + 1})">+</button>
              </div>
              <span class="line-total">${formatPrice(lineTotal)}</span>
              <button class="remove-btn" onclick="removeItem('${item.id}', '${bookId}')" title="Remove">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14H6L5 6"></path><path d="M10 11v6"></path><path d="M14 11v6"></path><path d="M9 6V4h6v2"></path></svg>
              </button>
            </div>
          </div>
        </div>`;
    }

    async function updateQty(itemId, bookId, newQty) {
      if (newQty < 1) return;
      try {
        await window.cart.updateQuantity(itemId, bookId, newQty);
        await loadCart();
      } catch (e) {
        showToast(e.message || 'Could not update quantity', 'error');
      }
    }

    async function removeItem(itemId, bookId) {
      try {
        await window.cart.removeItem(itemId, bookId);
        showToast('Item removed from cart', 'success');
        await loadCart();
      } catch (e) {
        showToast(e.message || 'Could not remove item', 'error');
      }
    }

    async function clearCart() {
      if (!confirm('Remove all items from your cart?')) return;
      try {
        await window.cart.clearCart();
        showToast('Cart cleared', 'success');
        await loadCart();
      } catch (e) {
        showToast(e.message || 'Could not clear cart', 'error');
      }
    }

    document.addEventListener('DOMContentLoaded', loadCart);
  </script>
</body>
</html>
